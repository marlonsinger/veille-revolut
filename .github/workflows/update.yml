name: Mise à jour Veille Revolut

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # NOUVEAU : Installation des dépendances pour le navigateur invisible
      - name: Installation de Puppeteer et PDF-Parse
        run: npm install puppeteer pdf-parse

      - name: Exécution du robot avec navigateur
        run: node bot.js

      - name: Sauvegarde du fichier status.json
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add status.json
          git commit -m "Mise à jour automatique du statut" || exit 0
          git push
