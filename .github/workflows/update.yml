name: Mise à jour Veille Revolut

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# LIGNE CRUCIALE : Autorise le robot à sauvegarder le fichier status.json
permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation de la librairie PDF
        run: npm install pdf-parse

      - name: Exécution du robot
        run: node scraper.js

      - name: Sauvegarde du fichier status.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add status.json
          git commit -m "Mise à jour automatique du statut" || exit 0
          git push
